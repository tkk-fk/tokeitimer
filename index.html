<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<title>時計タイマー</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --ink: #1a2030;
    --accent: #2563eb;
    --accent-soft: rgba(37,99,235,.10);
    --stop: #ef4444;
    --ready: #16a34a;
    --muted: #8896ab;
    --muted2: #5a6a7e;
    --shadow: 0 -4px 24px rgba(10,20,40,.09);
    --shadow-sm: 0 2px 8px rgba(10,20,40,.06);
    --sab: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: "M PLUS Rounded 1c", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100svh;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: contain;
  }

  body.hide-sec #hand-sec { display: none; }
  body.hide-remain .remain-bottom { display: none; }

  /* ===== 全体 ===== */
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ===== ヘッダー ===== */
  .top-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    min-height: 36px;
  }
  .app-title { font-size: .82rem; font-weight: 900; color: var(--muted2); }
  .offset-hint { font-weight: 400; font-size: .68rem; color: var(--muted); }
  .top-actions { display: flex; gap: 6px; align-items: center; }

  .icon-btn {
    border: none; background: var(--card); box-shadow: var(--shadow-sm);
    border-radius: 999px; height: 30px; padding: 0 10px;
    display: flex; align-items: center; gap: 4px;
    cursor: pointer; font-weight: 700; color: var(--ink);
    font-size: .72rem; white-space: nowrap; font-family: inherit;
  }
  .icon-btn:active { transform: scale(.96); }

  .toggle-label {
    display: flex; align-items: center; gap: 4px;
    font-size: .72rem; color: var(--muted2); cursor: pointer;
    white-space: nowrap; font-weight: 700;
  }
  .toggle-label input { width: 15px; height: 15px; accent-color: var(--accent); }

  /* ===== メインエリア ===== */
  .main-area {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
  }

  /* ===== 時計 ===== */
  .clock-zone {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 8px;
    gap: 0;
  }

  .clock-wrap {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    width: 100%;
    position: relative;
  }

  svg#clock {
    display: block;
    width: auto; height: 100%;
    max-width: 100%; max-height: 100%;
    aspect-ratio: 1/1;
    filter: drop-shadow(0 4px 16px rgba(10,20,40,0.08));
  }
  #timerArc { fill: var(--accent); opacity: 0.12; transition: fill 0.3s; }
  #timerLine { stroke: var(--accent); transition: stroke 0.3s; }

  /* 時計下の情報 */
  .timer-info {
    flex-shrink: 0;
    text-align: center;
    padding: 2px 0 0;
  }
  .remain-bottom {
    font-size: clamp(28px, 8vw, 56px);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    letter-spacing: .02em;
  }
  .sub-info {
    display: flex; gap: 10px; justify-content: center; align-items: center;
    font-size: clamp(.68rem, 2.3vw, .82rem);
    color: var(--muted2); font-weight: 700;
    line-height: 1.3;
  }
  .status-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--muted);
    margin-right: 2px; vertical-align: middle;
  }
  body.is-running .status-dot { background: var(--ready); }

  @keyframes blink { 50% { opacity: .4; } }
  .finished { animation: blink .65s step-end infinite; color: var(--stop) !important; }

  /* 点滅中は画面全体がタップで停止可能だと示すヒント */
  body.is-finished .clock-zone { cursor: pointer; }
  body.is-finished::after {
    content: '画面をタップで停止';
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, calc(-50% - 40vh));
    background: rgba(239,68,68,.95);
    color: #fff;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: .85rem;
    font-weight: 900;
    box-shadow: 0 4px 14px rgba(239,68,68,.35);
    pointer-events: none;
    z-index: 50;
    white-space: nowrap;
    opacity: 0;
    animation: fadeHint 2.4s ease-in-out infinite;
  }
  @keyframes fadeHint {
    0%, 100% { opacity: 0; transform: translate(-50%, calc(-50% - 40vh)) translateY(-6px); }
    50% { opacity: 1; transform: translate(-50%, calc(-50% - 40vh)) translateY(0); }
  }

  /* ===== ボトムパネル ===== */
  .bottom-panel {
    flex-shrink: 0;
    background: var(--card);
    border-radius: 22px 22px 0 0;
    box-shadow: var(--shadow);
    padding: 12px 12px calc(6px + var(--sab));
    display: flex; flex-direction: column;
    gap: 10px;
    transition: padding .2s;
  }

  /* --- プリセット --- */
  .presets {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  .preset {
    border: none;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 900;
    font-size: clamp(.78rem, 2.5vw, .9rem);
    padding: 10px 0;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    transition: background .12s, transform .08s;
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .preset:active { transform: scale(.94); }
  @keyframes presetFlash {
    0% { background: var(--accent); color: #fff; transform: scale(1.04); }
    100% { background: var(--accent-soft); color: var(--accent); transform: scale(1); }
  }
  .preset.flash { animation: presetFlash .35s ease-out; }

  /* --- 微調整 --- */
  .fine-tune {
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .num {
    width: 44px; height: 38px;
    text-align: center; font-size: 1.15rem; font-weight: 900;
    border: 2px solid var(--accent); border-radius: 10px;
    background: #fff; color: var(--ink); font-family: inherit;
    appearance: none; -webkit-appearance: none;
  }
  .unit { font-weight: 900; font-size: .75rem; color: var(--muted2); }
  .step-btn {
    width: 38px; height: 38px;
    border-radius: 50%; border: none;
    background: var(--accent); color: #fff;
    font-size: 1.2rem; font-weight: 900;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    padding-bottom: 2px;
    min-width: 38px;
    transition: transform .08s;
  }
  .step-btn:active { transform: scale(.88); }

  /* --- アクションボタン --- */
  .action-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 8px;
  }
  .btn {
    border: none; border-radius: 14px;
    font-weight: 900; font-size: clamp(.9rem, 2.8vw, 1.1rem);
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    height: 52px;
    transition: transform .08s;
  }
  .btn:active { transform: scale(.97); }
  .btn-start { background: var(--ready); color: #fff; }
  .btn-stop { background: #e2e8f0; color: var(--ink); }
  .btn-reset { background: #fff; color: var(--stop); border: 2px solid #fecaca; }
  .btn-full { background: #1e293b; color: #fff; font-size: clamp(.75rem, 2.2vw, .9rem); }

  /* --- 設定ボタン（改善版：くっきり目立つ） --- */
  .open-settings-btn {
    border: 2px solid var(--accent);
    background: #fff;
    color: var(--accent);
    font-weight: 900;
    font-size: .92rem;
    cursor: pointer;
    font-family: inherit;
    padding: 10px 14px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 46px;
    width: 100%;
    transition: transform .08s, background .15s;
    box-shadow: var(--shadow-sm);
  }
  .open-settings-btn:active { transform: scale(.97); background: var(--accent-soft); }
  .open-settings-btn .gear { font-size: 1.15rem; line-height: 1; }

  /* ===== 走行中：パネル最小化 ===== */
  body.is-running .presets { display: none; }
  body.is-running .fine-tune { display: none; }
  body.is-running .open-settings-btn { display: none; }
  body.is-running .bottom-panel { gap: 0; padding-top: 10px; }

  /* ===== 設定ボトムシート ===== */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10,20,40,.3);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0; z-index: 201;
    background: var(--card);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -8px 40px rgba(10,20,40,.15);
    padding: 0 16px calc(16px + var(--sab));
    max-height: 75svh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,.24,1);
  }
  .sheet-overlay.open .sheet { transform: translateY(0); }

  .sheet-handle {
    display: flex; justify-content: center; padding: 10px 0 6px;
    position: sticky; top: 0; background: var(--card); z-index: 1;
  }
  .sheet-handle::after {
    content: ''; width: 36px; height: 4px;
    background: #cbd5e1; border-radius: 2px;
  }
  .sheet-title {
    font-weight: 900; font-size: 1rem; margin: 0 0 12px;
    text-align: center; color: var(--ink);
  }
  .sheet-section {
    background: #f4f7fa; border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .sheet-section-title {
    font-weight: 900; font-size: .85rem; color: var(--muted2); margin-bottom: 10px;
  }
  .sheet-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .color-dots { display: flex; gap: 10px; }
  .dot {
    width: 34px; height: 34px;
    border-radius: 50%; cursor: pointer;
    border: 3px solid transparent;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
    transition: transform .15s;
  }
  .dot:active { transform: scale(.9); }
  .dot.active { border-color: #fff; outline: 3px solid var(--ink); transform: scale(1.12); }

  select {
    height: 42px; padding: 0 10px; border-radius: 10px;
    border: 1px solid #cbd5e1; background: #fff;
    font-size: .9rem; font-weight: 700; color: var(--ink);
    font-family: inherit; flex: 1;
  }
  .btn-mini {
    height: 42px; padding: 0 14px; border-radius: 10px; border: none;
    background: #e2e8f0; font-weight: 900; cursor: pointer;
    font-family: inherit; font-size: .85rem;
  }
  .vol-row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font-size: .85rem; color: var(--muted2); margin-top: 8px;
  }
  .vol-row span:first-child { font-weight: 900; }
  .vol-row input[type=range] { flex: 1; }
  .vol-row .vol-val { width: 3ch; text-align: right; font-weight: 900; }

  .sheet-close {
    display: block; width: 100%;
    border: none; background: var(--accent); color: #fff;
    font-weight: 900; font-size: 1rem;
    border-radius: 14px; height: 50px;
    cursor: pointer; font-family: inherit;
    margin-top: 6px;
  }

  /* ===== 全画面モード ===== */
  body.fullscreen-mode .bottom-panel { display: none; }
  body.fullscreen-mode .top-bar { display: none; }
  body.fullscreen-mode .timer-info { padding-bottom: 12px; }

  /* 全画面モード時の右上コントロール（スタート/ストップ + 全画面終了） */
  .fs-controls {
    display: none;
    position: absolute; top: 10px; right: 10px; z-index: 100;
    gap: 8px;
    align-items: center;
  }
  body.fullscreen-mode .fs-controls { display: flex; }
  .fs-controls button {
    border: none; border-radius: 999px;
    font-family: inherit; font-weight: 900;
    cursor: pointer;
    padding: 10px 20px;
    font-size: .9rem;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
    transition: transform .08s;
  }
  .fs-controls button:active { transform: scale(.96); }
  #btnToggleFull {
    background: var(--ready); color: #fff;
    box-shadow: 0 4px 14px rgba(22,163,74,.35);
    min-width: 110px;
  }
  #btnToggleFull.is-stop {
    background: rgba(255,255,255,.95); color: var(--ink);
    border: 1px solid var(--muted);
    box-shadow: 0 4px 12px rgba(0,0,0,.10);
  }
  /* 「えんちょう」ボタン：終了状態で目立たせる（オレンジ＋脈動） */
  #btnToggleFull.is-extend {
    background: #f59e0b; color: #fff;
    box-shadow: 0 4px 14px rgba(245,158,11,.45);
    animation: extendPulse 1.4s ease-in-out infinite;
    padding: 12px 24px;
    font-size: 1rem;
  }
  @keyframes extendPulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(245,158,11,.45), 0 0 0 0 rgba(245,158,11,.55); }
    50%      { box-shadow: 0 4px 18px rgba(245,158,11,.70), 0 0 0 10px rgba(245,158,11,0);  }
  }
  #btnExitFull {
    background: rgba(255,255,255,.92); color: var(--ink);
    border: 1px solid var(--muted);
    font-weight: 700; font-size: .82rem;
  }

  /* 延長モード：全画面中でも bottom-panel を表示して時間追加できるように */
  body.fullscreen-mode.extending .bottom-panel { display: flex; }
  /* 延長モード中は fs-controls の「えんちょう」自体を隠す（本体パネルのスタートを使う） */
  body.fullscreen-mode.extending #btnToggleFull { display: none; }

  /* 全画面＋点滅時は「画面をタップ」ヒントを非表示（ボタン操作で明示） */
  body.fullscreen-mode.is-finished::after { display: none; }

  /* ===== タブレット 2カラム ===== */
  @media (min-width: 768px) and (min-height: 500px) {
    .app { max-width: 1200px; margin: 0 auto; }
    .top-bar { padding: 10px 20px; }
    .main-area { flex-direction: row; gap: 20px; padding: 0 20px 16px; }
    .clock-zone { padding: 0; flex: 1.3; }
    .bottom-panel {
      flex: 0 0 360px; max-width: 400px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(10,20,40,.10);
      align-self: stretch; justify-content: center;
      padding: 20px; gap: 14px;
    }
    .btn { height: 60px; font-size: 1.05rem; }
    .preset { padding: 12px 0; font-size: .9rem; min-height: 48px; }
    .num { width: 52px; height: 44px; font-size: 1.3rem; }
    .step-btn { width: 42px; height: 42px; font-size: 1.3rem; }
    body.is-running .bottom-panel { gap: 14px; padding: 20px; }
    .open-settings-btn { font-size: 1rem; min-height: 50px; }
  }

  @media (min-width: 1024px) {
    .bottom-panel { flex: 0 0 400px; padding: 28px; }
    .btn { height: 64px; font-size: 1.1rem; }
  }

  /* ===== 極小画面（iPhone SE 等 ≤667px） ===== */
  @media (max-height: 667px) {
    .top-bar { padding: 4px 10px; min-height: 30px; }
    .bottom-panel { padding: 8px 10px calc(4px + var(--sab)); gap: 6px; }
    .presets { gap: 4px; }
    .preset { padding: 7px 0; min-height: 38px; font-size: .75rem; }
    .btn { height: 46px; }
    .remain-bottom { font-size: clamp(24px, 7vw, 40px); }
    .fine-tune { gap: 4px; }
    .num { width: 40px; height: 34px; font-size: 1rem; }
    .step-btn { width: 34px; height: 34px; font-size: 1.1rem; min-width: 34px; }
    .open-settings-btn { min-height: 40px; font-size: .82rem; padding: 8px 12px; }
  }

  /* ===== 超低画面（横向きスマホ等） ===== */
  @media (max-height: 500px) {
    .top-bar { display: none; }
    .bottom-panel { padding: 6px 10px calc(4px + var(--sab)); gap: 4px; border-radius: 16px 16px 0 0; }
    .presets { grid-template-columns: repeat(6, 1fr); gap: 3px; }
    .preset { min-height: 32px; padding: 4px 0; font-size: .72rem; border-radius: 8px; }
    .btn { height: 40px; border-radius: 10px; }
    .fine-tune { display: none; }
    .remain-bottom { font-size: clamp(22px, 5vw, 32px); }
    .open-settings-btn { min-height: 36px; font-size: .78rem; padding: 6px 10px; }
  }

  /* ===== ダイアログ ===== */
  dialog {
    border: none; border-radius: 20px; padding: 20px;
    width: min(92vw, 400px);
    box-shadow: 0 20px 60px rgba(10,20,40,.25);
    font-family: inherit;
  }
  dialog::backdrop { background: rgba(10,20,40,.35); }
  .dlg-title { margin: 0 0 6px; font-size: 1.05rem; font-weight: 900; }
  .dlg-sub { margin: 0 0 12px; color: var(--muted2); font-size: .85rem; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .badge {
    border: none; background: #e2e8f0; border-radius: 999px; padding: 8px 14px;
    font-weight: 900; cursor: pointer; font-family: inherit;
    min-height: 40px; display: flex; align-items: center;
  }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>

<body>
<div class="app" id="app">
  <div class="fs-controls">
    <button id="btnToggleFull" type="button">スタート</button>
    <button id="btnExitFull" type="button">✕ 全画面を終了</button>
  </div>

  <div class="top-bar">
    <div class="app-title">時計タイマー <span class="offset-hint" id="offsetHint">補正：0秒</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="btnOpenTimeDlg" type="button">⏱ 時刻合わせ</button>
    </div>
  </div>

  <div class="main-area">
    <div class="clock-zone">
      <div class="clock-wrap">
        <svg id="clock" viewBox="0 0 300 300" role="img" aria-label="アナログ時計">
          <defs>
            <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity=".10"/>
            </filter>
            <radialGradient id="faceBg" cx="50%" cy="48%" r="52%">
              <stop offset="0%" stop-color="#fff"/>
              <stop offset="100%" stop-color="#f8fafc"/>
            </radialGradient>
          </defs>
          <circle cx="150" cy="150" r="146" fill="url(#faceBg)" stroke="#c8d3e0" stroke-width="2"/>
          <g id="ticks"></g>
          <g id="nums"></g>
          <path id="timerArc" d=""></path>
          <path id="timerLine" d="" fill="none" stroke-width="10" stroke-linecap="round" filter="url(#shadow)"></path>
          <g id="hands" transform="translate(150,150)">
            <line id="hand-hour"   x1="0" y1="12" x2="0" y2="-66"  stroke="#1a2030" stroke-width="8" stroke-linecap="round"/>
            <line id="hand-minute" x1="0" y1="14" x2="0" y2="-108" stroke="#1a2030" stroke-width="5" stroke-linecap="round"/>
            <line id="hand-sec"    x1="0" y1="16" x2="0" y2="-118" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="0" cy="0" r="6" fill="#1a2030"/>
          </g>
        </svg>
      </div>

      <div class="timer-info">
        <div id="remainText" class="remain-bottom">--:--</div>
        <div class="sub-info">
          <span id="etaText">終了予定：--:--</span>
          <span><span class="status-dot"></span><span id="statusText">待機中</span></span>
        </div>
      </div>
    </div>

    <div class="bottom-panel">
      <div class="presets" id="presets">
        <button class="preset" data-m="1" data-s="0">1分</button>
        <button class="preset" data-m="3" data-s="0">3分</button>
        <button class="preset" data-m="5" data-s="0">5分</button>
        <button class="preset" data-m="10" data-s="0">10分</button>
        <button class="preset" data-m="15" data-s="0">15分</button>
        <button class="preset" data-m="20" data-s="0">20分</button>
      </div>

      <div class="fine-tune">
        <button class="step-btn" id="minDown" type="button">−</button>
        <input type="text" inputmode="numeric" id="minInput" class="num" value="0" readonly>
        <span class="unit">分</span>
        <button class="step-btn" id="minUp" type="button">＋</button>
        <span style="width:8px;"></span>
        <button class="step-btn" id="secDown" type="button">−</button>
        <input type="text" inputmode="numeric" id="secInput" class="num" value="0" readonly>
        <span class="unit">秒</span>
        <button class="step-btn" id="secUp" type="button">＋</button>
      </div>

      <div class="action-row">
        <button id="btnToggle" class="btn btn-start" type="button">スタート</button>
        <button id="btnReset" class="btn btn-reset" type="button">リセット</button>
        <button id="btnFull" class="btn btn-full" type="button">全画面</button>
      </div>

      <button class="open-settings-btn" id="openSettings" type="button">
        <span class="gear">⚙</span><span>いろ・おと・ひょうじ 設定</span>
      </button>
    </div>
  </div>
</div>

<dialog id="timeDlg">
  <div class="dlg-title">時刻合わせ</div>

  <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
    <input id="timeInput" type="time" style="font-size:1.1rem; padding:8px; border-radius:10px; border:1px solid #ccc; font-family:inherit;">

  </div>

    <button class="badge" data-d="-10000" type="button">-10秒</button>

    <button class="btn-mini" id="btnSaveOffset" type="button" style="background:var(--accent); color:#fff;">決定</button>
  </div>

<script>
(() => {
  const el = id => document.getElementById(id);
  const arcFill = el('timerArc'), arcLine = el('timerLine');
  const hH = el('hand-hour'), hM = el('hand-minute'), hS = el('hand-sec');
  const remainText = el('remainText'), etaText = el('etaText'), statusText = el('statusText');
  const minInput = el('minInput'), secInput = el('secInput');
  const soundSelect = el('soundSelect');
  const hideSecToggle = el('hideSecToggle');
  const hideRemainToggle = el('hideRemainToggle');

  /* 表示設定 */
  let hideSec = false, hideRemain = false;
  try { hideSec = localStorage.getItem('ut_hide_sec') === '1'; } catch(e){}
  try { hideRemain = localStorage.getItem('ut_hide_remain') === '1'; } catch(e){}

  const applyViewFlags = () => {
    document.body.classList.toggle('hide-sec', hideSec);
    document.body.classList.toggle('hide-remain', hideRemain);
    hideSecToggle.checked = hideSec;
    hideRemainToggle.checked = hideRemain;
  };
  hideSecToggle.addEventListener('change', e => {
    hideSec = !!e.target.checked;
    try { localStorage.setItem('ut_hide_sec', hideSec ? '1' : '0'); } catch(e){}
    applyViewFlags();
  });
  hideRemainToggle.addEventListener('change', e => {
    hideRemain = !!e.target.checked;
    try { localStorage.setItem('ut_hide_remain', hideRemain ? '1' : '0'); } catch(e){}
    applyViewFlags();
  });

  /* 状態 */
  const MAX_SEC = 60 * 60; // 最大60分
  let durationSec = 0, remainingSec = 0;
  let running = false, endTime = 0, rafId = 0;
  let offsetMs = 0;
  try { offsetMs = Number(localStorage.getItem('ut_offset') || 0); } catch(e){}

  /* 時計目盛り */
  const ticksG = el('ticks'), numsG = el('nums');
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * 2 * Math.PI;
    const is5 = i % 5 === 0;
    const r1 = 145, r2 = is5 ? 122 : 136;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", 150 + Math.sin(a) * r2);
    line.setAttribute("y1", 150 - Math.cos(a) * r2);
    line.setAttribute("x2", 150 + Math.sin(a) * r1);
    line.setAttribute("y2", 150 - Math.cos(a) * r1);
    line.setAttribute("stroke", is5 ? "#5a6a7e" : "#c8d3e0");
    line.setAttribute("stroke-width", is5 ? 3 : 1.2);
    line.setAttribute("stroke-linecap", "round");
    ticksG.appendChild(line);
  }
  for (let h = 1; h <= 12; h++) {
    const a = (h / 12) * 2 * Math.PI;
    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", 150 + Math.sin(a) * 106);
    txt.setAttribute("y", 150 - Math.cos(a) * 106 + 7);
    txt.setAttribute("text-anchor", "middle");
    txt.setAttribute("font-size", "20");
    txt.setAttribute("font-weight", "900");
    txt.setAttribute("fill", "#2a3444");
    txt.setAttribute("font-family", "'M PLUS Rounded 1c', sans-serif");
    txt.textContent = h;
    numsG.appendChild(txt);
  }

  /* 時計ロジック */
  function getNow() { return new Date(Date.now() + offsetMs); }
  function renderClock() {
    const d = getNow();
    const s = d.getSeconds() + d.getMilliseconds() / 1000;
    const m = d.getMinutes() + s / 60;
    const h = (d.getHours() % 12) + m / 60;
    hH.setAttribute('transform', `rotate(${h * 30})`);
    hM.setAttribute('transform', `rotate(${m * 6})`);
    hS.setAttribute('transform', `rotate(${s * 6})`);
    requestAnimationFrame(renderClock);
  }
  requestAnimationFrame(renderClock);

  /* タイマー描画 */
  function polar(cx, cy, r, deg) {
    const rad = deg * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  function drawTimer(rem) {
    if (rem <= 0) { arcFill.setAttribute('d', ''); arcLine.setAttribute('d', ''); return; }
    const d = getNow();
    const startDeg = (d.getMinutes() + d.getSeconds() / 60) * 6 - 90;
    const sweep = (rem / 3600) * 360;
    const endDeg = startDeg + Math.min(sweep, 359.9);
    const r = 132;
    const start = polar(150, 150, r, startDeg);
    const end = polar(150, 150, r, endDeg);
    const large = sweep > 180 ? 1 : 0;
    arcFill.setAttribute('d', `M 150 150 L ${start.x} ${start.y} A ${r} ${r} 0 ${large} 1 ${end.x} ${end.y} Z`);
    arcLine.setAttribute('d', `M ${start.x} ${start.y} A ${r} ${r} 0 ${large} 1 ${end.x} ${end.y}`);
  }

  /* UI更新 */
  function updateText() {
    const m = Math.floor(remainingSec / 60);
    const s = Math.floor(remainingSec % 60);
    const txt = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    remainText.textContent = txt;
    drawTimer(remainingSec);
    if (remainingSec > 0) {
      const t = new Date(Date.now() + offsetMs + remainingSec * 1000);
      etaText.textContent = `終了予定：${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}`;
    } else {
      etaText.textContent = '終了予定：--:--';
    }
  }

  /* 時間セット（直接値指定） */
  function setTime(m, s) {
    m = Math.max(0, m);
    s = Math.max(0, s);
    // 秒の繰り上げ・繰り下げ
    if (s >= 60) { m += Math.floor(s / 60); s = s % 60; }
    // 上限60分でクランプ
    let total = m * 60 + s;
    if (total > MAX_SEC) total = MAX_SEC;
    m = Math.floor(total / 60);
    s = total % 60;
    minInput.value = m;
    secInput.value = s;
    durationSec = total;
    remainingSec = durationSec;
    statusText.textContent = '待機中';
    remainText.classList.remove('finished');
    document.body.classList.remove('is-finished');
    updateText();
  }

  /* 時間加算（プリセット用） */
  function addTime(addM, addS) {
    if (running) return;
    const addTotal = addM * 60 + addS;
    const newTotal = Math.min(MAX_SEC, durationSec + addTotal);
    const m = Math.floor(newTotal / 60);
    const s = newTotal % 60;
    setTime(m, s);
  }

  /* ＋／− 微調整：1クリック1ステップ（連続実行なし） */
  function nudge(dm, ds) {
    if (running) return;
    let m = parseInt(minInput.value) || 0;
    let s = parseInt(secInput.value) || 0;
    let total = m * 60 + s + dm * 60 + ds;
    if (total < 0) total = 0;
    if (total > MAX_SEC) total = MAX_SEC;
    setTime(Math.floor(total / 60), total % 60);
  }

  /* ＋／− 長押し対応：押している間連続、離せば必ず止まる
     - Pointer Events で touch/mouse/pen を一括管理
     - pointerup / pointercancel / pointerleave / blur / visibilitychange で
       「指が外れた」「画面が切り替わった」など、あらゆるケースで確実に停止 */
  function attachHold(btn, cb) {
    let initialTimer = null;
    let repeatInterval = null;
    let isHolding = false;

    const stop = () => {
      isHolding = false;
      if (initialTimer) { clearTimeout(initialTimer); initialTimer = null; }
      if (repeatInterval) { clearInterval(repeatInterval); repeatInterval = null; }
    };

    const start = (e) => {
      e.preventDefault();
      if (isHolding) return; // 二重起動防止
      isHolding = true;
      cb(); // すぐに1回
      // 350ms待ってから連続実行（誤押下で連射されないように）
      initialTimer = setTimeout(() => {
        // 80ms間隔で連続実行
        repeatInterval = setInterval(() => {
          if (!isHolding) { clearInterval(repeatInterval); repeatInterval = null; return; }
          cb();
        }, 80);
      }, 350);
    };

    // 押下開始
    btn.addEventListener('pointerdown', start);
    // 「離す」「キャンセル」「ボタンから指が外れる」のいずれでも止める
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('pointerleave', stop);
    // クリックイベントは pointerdown で既に処理済みなので発火しても無視させる
    btn.addEventListener('click', e => e.preventDefault());

    // 安全網：ウィンドウ・ドキュメントレベルでも停止トリガを登録
    window.addEventListener('pointerup', stop);
    window.addEventListener('pointercancel', stop);
    window.addEventListener('blur', stop);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stop();
    });
  }

  attachHold(el('minUp'),   () => nudge(1, 0));
  attachHold(el('minDown'), () => nudge(-1, 0));
  attachHold(el('secUp'),   () => nudge(0, 5));
  attachHold(el('secDown'), () => nudge(0, -5));

  /* プリセット：累積式（押した回数分加算） */
  const presetBtns = document.querySelectorAll('.preset');
  presetBtns.forEach(b => {
    b.addEventListener('click', () => {
      if (running) return;
      const addM = parseInt(b.dataset.m) || 0;
      const addS = parseInt(b.dataset.s) || 0;
      addTime(addM, addS);
      // 視覚フィードバック（押すたびに一瞬光る）
      b.classList.remove('flash');
      // リフロー強制（同じボタンを連打しても毎回アニメーションが発火するように）
      void b.offsetWidth;
      b.classList.add('flash');
    });
  });

  /* オーディオ */
  let audioCtx = null, masterGain = null, comp = null, lp = null;
  const volRange = el('volRange'), volLabel = el('volLabel');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let vol01 = 0.22;
  try { vol01 = Number(localStorage.getItem('ut_vol01') || 0.22); } catch(e){}

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = vol01;
    comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -26; comp.knee.value = 18; comp.ratio.value = 6;
    comp.attack.value = 0.003; comp.release.value = 0.22;
    lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1800; lp.Q.value = 0.7;
    masterGain.connect(comp); comp.connect(lp); lp.connect(audioCtx.destination);
  }
  function unlockAudio() {
    ensureAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 440; g.gain.value = 0.00001;
    o.connect(g); g.connect(masterGain);
    const t = audioCtx.currentTime; o.start(t); o.stop(t + 0.02);
  }
  function playNote(freq, when, dur, opts = {}) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = opts.type || 'sine'; o.frequency.value = freq; o.detune.value = opts.detune ?? 0;
    o.connect(g); g.connect(masterGain);
    const t0 = audioCtx.currentTime + when, peak = 1.0 * (opts.gain ?? 1);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.035);
    g.gain.linearRampToValueAtTime(peak * 0.55, t0 + 0.125);
    g.gain.setValueAtTime(peak * 0.55, t0 + dur);
    g.gain.linearRampToValueAtTime(0, t0 + dur + 0.28);
    o.start(t0); o.stop(t0 + dur + 0.33);
  }
  /* やさしい：ド・ミ・ドの3音（柔らかい） */
  function playSoftChime() {
    [{f:523.25,t:0,d:.22},{f:659.25,t:.18,d:.26},{f:523.25,t:.44,d:.30}].forEach(n => {
      playNote(n.f, n.t, n.d, {type:'sine', gain:.85});
      playNote(n.f, n.t, n.d, {type:'sine', gain:.35, detune:7});
    });
  }
  /* チャイム：学校チャイム風（ウエストミンスター風の4音「キーン・コーン・カーン・コーン」） */
  function playSchoolChime() {
    const notes = [
      {f: 659.25, t: 0.00, d: .42}, // ミ
      {f: 587.33, t: 0.46, d: .42}, // レ
      {f: 523.25, t: 0.92, d: .42}, // ド
      {f: 392.00, t: 1.38, d: .70}, // ソ（低めで終結感）
    ];
    notes.forEach(n => {
      // メインのサイン波
      playNote(n.f, n.t, n.d, {type:'sine', gain:.80});
      // オクターブ上の倍音で鐘らしい明るさを足す
      playNote(n.f * 2, n.t, n.d * 0.6, {type:'sine', gain:.18});
      // 三角波を微デチューンで重ねて厚みと揺らぎを出す
      playNote(n.f, n.t, n.d, {type:'triangle', gain:.22, detune:5});
    });
  }
  function playSoftPipipi() { [0,.22,.44].forEach(t => playNote(660, t, .10, {type:'sine', gain:.65})); }
  function playSoftBell() {
    playNote(440, 0, .35, {type:'sine', gain:.75});
    playNote(440, 0, .35, {type:'triangle', gain:.25});
    playNote(554.37, .20, .40, {type:'sine', gain:.65});
  }
  function playAlarm() {
    if (!audioCtx) return;
    const m = soundSelect.value;
    if (m === 'pipipi') playSoftPipipi();
    else if (m === 'bell') playSoftBell();
    else if (m === 'chime') playSchoolChime();
    else playSoftChime(); // 'soft'（やさしい）
  }

  el('btnPreview').onclick = () => { unlockAudio(); playAlarm(); };

  if (volRange && volLabel) {
    const toUI = v => Math.round((v / 0.35) * 100);
    const fromUI = v => clamp((Number(v) / 100) * 0.35, 0, 0.35);
    volRange.value = String(toUI(vol01)); volLabel.textContent = volRange.value;
    volRange.addEventListener('input', () => {
      volLabel.textContent = volRange.value;
      vol01 = fromUI(volRange.value);
      try { localStorage.setItem('ut_vol01', String(vol01)); } catch(e){}
      if (masterGain) masterGain.gain.value = vol01;
    });
  }

  /* タイマー操作 */
  const btnToggle = el('btnToggle');
  const btnToggleFull = el('btnToggleFull');
  function updateToggleBtn() {
    // 本体ボタン（btnToggle）：スタート ⇄ ストップ
    if (running) {
      btnToggle.textContent = 'ストップ';
      btnToggle.classList.remove('btn-start');
      btnToggle.classList.add('btn-stop');
    } else {
      btnToggle.textContent = 'スタート';
      btnToggle.classList.remove('btn-stop');
      btnToggle.classList.add('btn-start');
    }
    // 全画面用ボタン（btnToggleFull）：スタート / ストップ / えんちょう の3状態
    btnToggleFull.classList.remove('is-stop', 'is-extend');
    if (document.body.classList.contains('is-finished')) {
      btnToggleFull.textContent = 'えんちょう';
      btnToggleFull.classList.add('is-extend');
    } else if (running) {
      btnToggleFull.textContent = 'ストップ';
      btnToggleFull.classList.add('is-stop');
    } else {
      btnToggleFull.textContent = 'スタート';
    }
  }

  // 全画面用ボタンのクリック：
  //  - 「えんちょう」状態なら、延長モードに入って本体パネルを表示
  //  - それ以外は本体ボタンに委譲
  btnToggleFull.addEventListener('click', () => {
    if (document.body.classList.contains('is-finished')) {
      // 点滅停止 → 延長モードに遷移（全画面はそのまま、本体パネルが現れる）
      remainText.classList.remove('finished');
      document.body.classList.remove('is-finished');
      document.body.classList.add('extending');
      statusText.textContent = '時間を設定してください';
      minInput.value = 0; secInput.value = 0;
      durationSec = 0; remainingSec = 0;
      updateText();
      updateToggleBtn();
      return;
    }
    btnToggle.click();
  });

  btnToggle.onclick = () => {
    if (running) {
      // ストップ
      running = false; document.body.classList.remove('is-running');
      statusText.textContent = '一時停止'; cancelAnimationFrame(rafId);
      updateToggleBtn();
    } else {
      // スタート
      if (remainingSec <= 0) { statusText.textContent = '時間を設定してください'; return; }
      unlockAudio(); running = true;
      document.body.classList.add('is-running');
      document.body.classList.remove('extending'); // 延長モードを終了
      statusText.textContent = 'カウント中…';
      remainText.classList.remove('finished');
      document.body.classList.remove('is-finished');
      endTime = performance.now() + remainingSec * 1000;
      updateToggleBtn();
      tick();
    }
  };
  el('btnReset').onclick = () => {
    running = false; document.body.classList.remove('is-running');
    cancelAnimationFrame(rafId);
    minInput.value = 0; secInput.value = 0;
    durationSec = 0; remainingSec = 0;
    statusText.textContent = '待機中';
    remainText.classList.remove('finished');
    document.body.classList.remove('is-finished');
    updateText(); updateToggleBtn();
  };

  function tick() {
    if (!running) return;
    remainingSec = Math.max(0, (endTime - performance.now()) / 1000);
    updateText();
    if (remainingSec <= 0.05) {
      running = false; document.body.classList.remove('is-running');
      statusText.textContent = '時間です';
      remainText.classList.add('finished');
      document.body.classList.add('is-finished');
      playAlarm(); remainingSec = 0; updateText(); updateToggleBtn(); return;
    }
    rafId = requestAnimationFrame(tick);
  }

  /* === 0:00 点滅中：画面のどこを触っても点滅停止 ===
     ただし全画面モード中は専用ボタン（えんちょう / 全画面を終了）で操作するため、
     画面タップでの自動停止は無効にする */
  function stopFinishedBlink(e) {
    if (!document.body.classList.contains('is-finished')) return;
    if (document.body.classList.contains('fullscreen-mode')) return;
    remainText.classList.remove('finished');
    document.body.classList.remove('is-finished');
    statusText.textContent = '待機中';
    minInput.value = 0; secInput.value = 0;
    durationSec = 0; remainingSec = 0;
    updateText(); updateToggleBtn();
  }
  document.addEventListener('pointerdown', stopFinishedBlink, true);

  /* 色変更 */
  document.querySelectorAll('.dot').forEach(d => {
    d.onclick = () => {
      document.querySelectorAll('.dot').forEach(x => x.classList.remove('active'));
      d.classList.add('active');
      const c = d.dataset.color;
      document.documentElement.style.setProperty('--accent', c);
      // accent-soft（10%透過）も連動
      const hex = c.replace('#','');
      const r = parseInt(hex.substr(0,2),16);
      const g = parseInt(hex.substr(2,2),16);
      const b = parseInt(hex.substr(4,2),16);
      document.documentElement.style.setProperty('--accent-soft', `rgba(${r},${g},${b},0.10)`);
    };
  });

  /* 設定ボトムシート */
  const overlay = el('sheetOverlay');
  el('openSettings').onclick = () => overlay.classList.add('open');
  el('closeSheet').onclick = () => overlay.classList.remove('open');
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

  /* 全画面モード */
  function enterFullscreen() {
    document.body.classList.add('fullscreen-mode');
    const docEl = document.documentElement;
    const rfs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
    if (rfs) rfs.call(docEl).catch(() => {});
  }
  function exitFullscreen() {
    document.body.classList.remove('fullscreen-mode');
    document.body.classList.remove('extending');
    const efs = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (efs && document.fullscreenElement) efs.call(document).catch(() => {});
  }
  el('btnFull').onclick = () => enterFullscreen();
  el('btnExitFull').onclick = () => exitFullscreen();
  // ブラウザの全画面解除（Escキーなど）に連動
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) document.body.classList.remove('fullscreen-mode');
  });
  document.addEventListener('webkitfullscreenchange', () => {
    if (!document.webkitFullscreenElement) document.body.classList.remove('fullscreen-mode');
  });

  /* 時刻合わせ */
  const dlg = el('timeDlg');
  el('btnOpenTimeDlg').onclick = () => {
    el('offsetText').textContent = `±${Math.round(offsetMs / 60000)}分`;
    dlg.showModal();
  };
  dlg.querySelectorAll('.badge').forEach(b => {
    b.onclick = () => {
      offsetMs += Number(b.dataset.d);
      try { localStorage.setItem('ut_offset', offsetMs); } catch(e){}
      el('offsetText').textContent = `${offsetMs >= 0 ? '+' : ''}${Math.round(offsetMs / 1000)}秒`;
      el('offsetHint').textContent = `補正：${Math.round(offsetMs / 1000)}秒`;
    };
  });
  el('btnSaveOffset').onclick = () => dlg.close();
  el('btnResetOffset').onclick = () => {
    offsetMs = 0; try { localStorage.setItem('ut_offset', 0); } catch(e){}
    dlg.close(); el('offsetHint').textContent = '補正：0秒';
  };

  /* 初期化 */
  el('offsetHint').textContent = `補正：${Math.round(offsetMs / 1000)}秒`;
  durationSec = 0;
  remainingSec = 0;
  applyViewFlags(); updateText();
})();
</script>
</body>
</html>
