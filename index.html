<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>時計タイマー</title>

<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff; --ink:#0f172a; --muted:#e5e7eb; --accent:#1e90ff; --done:#22c55e;
    --gap:12px; --card-pad:12px; --btn-fz:16px; --btn-py:12px; --btn-px:14px;
    --clockMaxW: 64vw; --clockMaxH: 70svh; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: system-ui,-apple-system,"BIZ UDPGothic","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    overscroll-behavior:contain;
    padding-bottom:calc(var(--safe-b) + 4px);
  }

  /* ===== レイアウト ===== */
  .shell{
    min-height:100svh;
    display:grid;
    /* 右カラムを約2/3に縮小（比率 1.45 : 0.55）＆最小幅も 240px に */
    grid-template-columns: minmax(520px, 1.45fr) minmax(240px, 0.55fr);
    grid-template-rows: auto 1fr;
    grid-template-areas:"head head" "clock side";
    gap:var(--gap);
    padding:10px clamp(10px, 2vw, 18px);
    max-width:1400px; margin:0 auto;
  }
  .topbar{ grid-area:head; display:flex; align-items:flex-end; justify-content:space-between; gap:10px }
  h1{ margin:0; font-size:clamp(18px,3.6vw,28px); letter-spacing:.02em }

  .clock-pane{ grid-area:clock; display:flex; align-items:center; justify-content:center; }
  .clock-wrap{ display:flex; flex-direction:column; align-items:center; gap:8px }
  svg#clock{ width:min(var(--clockMaxW),var(--clockMaxH)); height:auto; max-height:var(--clockMaxH) }

  /* デジタル時刻（12時間表示） */
  .digital{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  #digitalTime{
    font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(18px,4.4vw,24px); letter-spacing:.02em;
    padding:8px 12px; border-radius:12px; border:1px solid var(--muted);
    background:#fff; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .tap-hint{ margin:0; font-size:12px; color:#6b7280 }

  .side{
    grid-area:side;
    display:grid; gap:var(--gap); grid-auto-rows:auto; min-height:0;
  }

  .panel, .ctrl, .sound, .numeric{
    padding:var(--card-pad); border:1px solid var(--muted);
    border-radius:14px; background:#fff;
  }
  .panel{ display:grid; gap:8px; text-align:center }
  .remain{ font-weight:700; font-size:clamp(22px,5vw,36px); letter-spacing:.02em }
  .eta{ font-size:clamp(12px,2.4vw,15px); opacity:.85 }
  .status{ font-size:12px; color:#64748b }

  .ctrl{ display:flex; gap:8px; justify-content:center; align-items:center; }
  .btn{
    padding:var(--btn-py) var(--btn-px);
    border-radius:12px; border:1px solid var(--muted);
    background:#fff; font-size:var(--btn-fz); cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.05); min-height:44px;
  }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent) }
  .btn:active{ transform:translateY(1px) }

  details.sound > summary{
    list-style:none; user-select:none; -webkit-user-select:none; cursor:pointer;
    font-weight:700; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--muted);
    background:#fff;
  }
  details.sound[open] > summary{ border-bottom-left-radius:8px; border-bottom-right-radius:8px }
  .sound-body{ padding:10px 0 0 }
  .sound-row{ display:grid; grid-template-columns: 1fr auto; gap:8px; align-items:center }
  .sound select{ width:100%; padding:10px; font-size:16px; border:1px solid var(--muted); border-radius:10px; background:#f9fafb; }

  .numeric{ display:grid; gap:10px }
  .num-grid{
    display:grid; grid-template-columns: 1fr auto 1fr auto;
    gap:10px; align-items:center; justify-content:center;
  }
  .field{ display:flex; align-items:center; gap:10px; justify-content:center }
  .label{ font-weight:700; min-width:2.5em; text-align:center }
  .inputWrap{ display:flex; align-items:center; gap:8px }
  input[type="number"]{
    width:7ch; padding:10px; font-size:20px; text-align:center;
    border-radius:12px; border:1px solid var(--muted); background:#f9fafb;
    appearance:textfield; -moz-appearance:textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0 }
  .arrows{ display:flex; flex-direction:column; gap:6px }
  .btn-arrow{
    width:44px; height:36px; border-radius:10px; font-weight:700;
    border:1px solid var(--muted); background:#fff; cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .hint{ margin:0; text-align:center; font-size:12px; color:#6b7280 }

  @media (max-height:760px){
    :root{ --clockMaxH: 58svh }
    .panel, .ctrl, .numeric{ padding:10px }
    .btn{ --btn-py:10px; --btn-px:12px; --btn-fz:15px }
  }
  @media (max-height:640px){
    :root{ --clockMaxH: 50svh }
    h1{ font-size:clamp(18px,3vw,24px) }
    .remain{ font-size:clamp(20px,4.4vw,30px) }
  }

  @media (max-width:920px){
    .shell{
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr;
      grid-template-areas:"head" "clock" "side";
      gap:10px;
    }
    :root{ --clockMaxW: 92vw; --clockMaxH: 56svh }
    .side{ padding-bottom:0; gap:10px; }
    .btn.primary{ flex:1 } .btn{ min-width:0 }
    details.sound:not([open]) .sound-body{ display:none }
  }
  @media (max-width:520px){
    .num-grid{ grid-template-columns: 1fr auto; row-gap:10px }
    .label{ min-width:2.2em }
    :root{ --clockMaxH: 52svh }
  }

  .flash{ animation:flash .9s ease-out 2 }
  @keyframes flash{
    0%{ box-shadow:0 0 0 0 rgba(34,197,94,.0) }
    50%{ box-shadow:0 0 0 12px rgba(34,197,94,.25) }
    100%{ box-shadow:0 0 0 0 rgba(34,197,94,0) }
  }


  /* 時刻調整ダイアログ */
  dialog#timeDlg{ border:none; border-radius:14px; padding:14px;
    width:min(92vw, 420px); box-shadow:0 10px 30px rgba(0,0,0,.2); }
  #timeDlg::backdrop{ background:rgba(0,0,0,.25) }
  .dlg-title{ margin:0 0 6px 0; font-size:18px; font-weight:700 }
  .dlg-row{ display:grid; grid-template-columns: 1fr auto; align-items:center; gap:10px; margin:10px 0 }
  #timeInput{ font-size:18px; padding:8px 10px; border:1px solid var(--muted); border-radius:10px; background:#f9fafb }
  .offset-line{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .offset-badges{ display:flex; flex-wrap:wrap; gap:6px }
  .badge{ padding:6px 10px; border:1px solid var(--muted); border-radius:10px; background:#fff; cursor:pointer; }
  .dlg-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:12px }
  .dlg-actions .left{ margin-right:auto }
  .muted{ color:#64748b; font-size:12px; margin:0 }
</style>
</head>
<body>
  <div class="shell" id="app">
    <header class="topbar"><div><h1>時計タイマー</h1></div></header>

    <section class="clock-pane">
      <div class="clock-wrap">
        <svg id="clock" viewBox="0 0 300 300" role="img" aria-label="アナログ時計">
          <defs>
            <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".22"/>
            </filter>
          </defs>
          <circle cx="150" cy="150" r="140" fill="#fff" stroke="#d8dde3" stroke-width="2"/>
          <g id="ticks"></g><g id="nums"></g>
          <circle cx="150" cy="150" r="132" fill="none" stroke="#eef2f7" stroke-width="8"/>
          <path id="timerArc" d="" fill="none" stroke="var(--accent)" stroke-width="10"
                stroke-linecap="round" filter="url(#shadow)" style="display:none"/>
          <g id="hands" transform="translate(150,150)">
            <line id="hand-hour"   x1="0" y1="12" x2="0" y2="-70"  stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
            <line id="hand-minute" x1="0" y1="14" x2="0" y2="-110" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
            <line id="hand-sec"    x1="0" y1="16" x2="0" y2="-120" stroke="#ef4444"  stroke-width="2" stroke-linecap="round"/>
            <circle cx="0" cy="0" r="5" fill="#0f172a"/>
          </g>
        </svg>

        <!-- デジタル表示（12時間表示・タップで調整） -->
        <div class="digital">
          <button id="digitalTime" type="button" aria-label="現在時刻（12時間表記・タップで調整）">--:--:--</button>
          <p class="tap-hint">タップで調整</p>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="panel">
        <div class="remain" id="remainText">--:--</div>
        <div class="eta" id="etaText">終了予定時刻 --:--</div>
        <div class="status" id="statusText" aria-live="polite">待機中</div>
      </div>

      <details id="soundBox" class="sound" aria-label="アラーム音の設定">
        <summary>🔔 アラーム音 <span id="soundName">（ピピピ）</span></summary>
        <div class="sound-body">
          <div class="sound-row">
            <select id="soundSelect" aria-label="サウンドを選択">
              <option value="pipipi" selected>ピピピ（短3回）</option>
              <option value="chime">チャイム（高→低 2音）</option>
              <option value="bell">ベル（トライアングル風）</option>
              <option value="long">のびるビープ</option>
              <option value="down3">下降3音</option>
            </select>
            <button class="btn" id="btnPreview" type="button">試聴</button>
          </div>
        </div>
      </details>

      <!-- 分・秒 -->
      <div class="numeric" aria-label="時間設定（数字入力＋矢印・即時反映）">
        <div class="num-grid">
          <div class="field">
            <span class="label">分</span>
            <div class="inputWrap">
              <input id="minInput" type="number" min="0" max="60" step="1" value="5" inputmode="numeric" aria-label="分">
              <div class="arrows" data-for="minInput">
                <button class="btn-arrow up" type="button" aria-label="分を増やす">▲</button>
                <button class="btn-arrow down" type="button" aria-label="分を減らす">▼</button>
              </div>
            </div>
          </div>
          <div class="field">
            <span class="label">秒</span>
            <div class="inputWrap">
              <input id="secInput" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" aria-label="秒">
              <div class="arrows" data-for="secInput">
                <button class="btn-arrow up" type="button" aria-label="秒を増やす">▲</button>
                <button class="btn-arrow down" type="button" aria-label="秒を減らす">▼</button>
              </div>
            </div>
          </div>
        </div>
        <p class="hint">数字/矢印で即時反映（最大60分）</p>
      </div>

      <!-- 操作ボタン -->
      <div class="ctrl" id="ctrlBar">
        <button class="btn primary" id="btnStart">開始</button>
        <button class="btn" id="btnPause">一時停止</button>
        <button class="btn" id="btnReset">リセット</button>
      </div>
    </aside>
  </div>

  <!-- 時刻調整ダイアログ -->
  <dialog id="timeDlg" aria-labelledby="dlgTitle">
    <h3 class="dlg-title" id="dlgTitle">時計の時刻調整</h3>
    <p class="muted">教室の壁掛け時計とずれているときに使います。補正は端末に保存されます。</p>

    <div class="dlg-row">
      <label for="timeInput">表示したい時刻</label>
      <input id="timeInput" type="time" step="60" aria-label="表示したい時刻（分単位）">
    </div>

    <div class="offset-line">
      <div>現在の補正：<strong id="offsetText">±0分0秒</strong></div>
      <div class="offset-badges">
        <button type="button" class="badge" data-d="-300000">-5分</button>
        <button type="button" class="badge" data-d="-60000">-1分</button>
        <button type="button" class="badge" data-d="-10000">-10秒</button>
        <button type="button" class="badge" data-d="10000">+10秒</button>
        <button type="button" class="badge" data-d="60000">+1分</button>
        <button type="button" class="badge" data-d="300000">+5分</button>
      </div>
    </div>

    <div class="dlg-actions">
      <button type="button" class="btn left" id="btnResetOffset">リセット</button>
      <button type="button" class="btn" id="btnCancelDlg">キャンセル</button>
      <button type="button" class="btn primary" id="btnSaveOffset">保存</button>
    </div>
  </dialog>

  <script>
  (() => {
    // ===== ズーム抑止 =====
    let lastTouchEnd = 0;
    document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, {passive:false});

    // ===== 参照 =====
    const ticksG = document.getElementById('ticks');
    const numsG  = document.getElementById('nums');
    const hH = document.getElementById('hand-hour');
    const hM = document.getElementById('hand-minute');
    const hS = document.getElementById('hand-sec');
    const arc = document.getElementById('timerArc');

    const remainText = document.getElementById('remainText');
    const etaText = document.getElementById('etaText');
    const statusText = document.getElementById('statusText');

    const btnStart = document.getElementById('btnStart');
    const btnPause = document.getElementById('btnPause');
    const btnReset = document.getElementById('btnReset');

    const minInput = document.getElementById('minInput');
    const secInput = document.getElementById('secInput');

    const soundBox    = document.getElementById('soundBox');
    const soundSelect = document.getElementById('soundSelect');
    const btnPreview  = document.getElementById('btnPreview');
    const soundName   = document.getElementById('soundName');

    const digitalBtn  = document.getElementById('digitalTime');
    const timeDlg     = document.getElementById('timeDlg');
    const timeInput   = document.getElementById('timeInput');
    const offsetText  = document.getElementById('offsetText');
    const btnResetOffset = document.getElementById('btnResetOffset');
    const btnSaveOffset  = document.getElementById('btnSaveOffset');
    const btnCancelDlg   = document.getElementById('btnCancelDlg');

    // ===== 時計補正（オフセット） =====
    let offsetMs = Number(localStorage.getItem('clockOffsetMs') || 0);
    let offsetMsBeforeOpen = offsetMs;

    const SOUND_LABELS = { pipipi:'ピピピ', chime:'チャイム', bell:'ベル', long:'のびるビープ', down3:'下降3音', file:'カスタム' };
    function updateSoundName(){ soundName.textContent = `（${SOUND_LABELS[soundSelect.value]||'ピピピ'}）`; }
    updateSoundName();

    soundSelect.addEventListener('change', updateSoundName);
    btnPreview.addEventListener('click', () => { playAlarm(); });

    // 目盛り＆数字
    for (let i=0;i<60;i++){
      const a = (i/60)*2*Math.PI;
      const outer = 138;
      const inner = i%5===0 ? 124 : 130;
      const x1 = 150 + Math.sin(a)*inner, y1 = 150 - Math.cos(a)*inner;
      const x2 = 150 + Math.sin(a)*outer, y2 = 150 - Math.cos(a)*outer;
      const line = document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1",x1); line.setAttribute("y1",y1);
      line.setAttribute("x2",x2); line.setAttribute("y2",y2);
      line.setAttribute("stroke", i%5===0 ? "#9aa3ae" : "#c8ced6");
      line.setAttribute("stroke-width", i%5===0 ? 2.2 : 1);
      ticksG.appendChild(line);
    }
    for (let h=1;h<=12;h++){
      const a = (h/12)*2*Math.PI, r = 112;
      const x = 150 + Math.sin(a)*r, y = 150 - Math.cos(a)*r + 5;
      const t = document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",x); t.setAttribute("y",y);
      t.setAttribute("text-anchor","middle"); t.setAttribute("font-size","16");
      t.setAttribute("font-weight","700"); t.textContent = h;
      numsG.appendChild(t);
    }

    // ===== 状態 =====
    let durationSec = 5 * 60;
    let remainingSec = durationSec;
    let running = false;
    let startTimeMs = 0;
    let endTimeMs = 0;
    let visualStartDeg = nowMinuteAngleDeg();

    let rafId = 0;
    let audioCtx = null;
    let customBuffer = null;
  

    if (window.matchMedia('(min-width: 921px)').matches) {
      soundBox.setAttribute('open','');
    }

    // ===== ユーティリティ =====
    function adjustedNow(){ return new Date(Date.now() + offsetMs); }
    function fmtOffset(ms){
      const sign = ms>=0 ? '+' : '−';
      const a = Math.abs(ms); const m = Math.floor(a/60000);
      const s = Math.floor((a%60000)/1000);
      return `${sign}${m}分${s}秒`;
    }
    // 12時間表記（午前/午後）で固定
    function format12JP(d){
      let h24 = d.getHours();
      const am = h24 < 12;
      let h12 = h24 % 12; if(h12 === 0) h12 = 12;
      const mm = String(d.getMinutes()).padStart(2,'0');
      const ss = String(d.getSeconds()).padStart(2,'0');
      return `${am ? '午前' : '午後'} ${h12}:${mm}:${ss}`;
    }

    // ===== デジタル表示（12時間） =====
    let lastSecShown = -1;
    function updateDigital(){
      const d = adjustedNow();
      const sec = d.getSeconds();
      if(sec === lastSecShown) return;
      lastSecShown = sec;
      digitalBtn.textContent = format12JP(d);
    }
    digitalBtn.addEventListener('click', () => {
      offsetMsBeforeOpen = offsetMs;
      const d = adjustedNow();
      timeInput.value = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      offsetText.textContent = fmtOffset(offsetMs);
      timeDlg.showModal();
    });

    timeDlg.querySelectorAll('.badge').forEach(b=>{
      b.addEventListener('click', ()=>{
        offsetMs += Number(b.dataset.d||0);
        offsetText.textContent = fmtOffset(offsetMs);
        localStorage.setItem('clockOffsetMs', String(offsetMs));
        const d = adjustedNow();
        timeInput.value = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      });
    });
    timeInput.addEventListener('change', ()=>{
      const now = new Date();
      const [hh,mm] = (timeInput.value || '00:00').split(':').map(n=>parseInt(n||'0',10));
      const target = new Date(now);
      target.setHours(hh, mm, now.getSeconds(), now.getMilliseconds());
      offsetMs = target.getTime() - now.getTime();
      offsetText.textContent = fmtOffset(offsetMs);
    });
    btnResetOffset.addEventListener('click', ()=>{
      offsetMs = 0; offsetText.textContent = fmtOffset(offsetMs);
      const d = adjustedNow();
      timeInput.value = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    });
    btnCancelDlg.addEventListener('click', ()=>{ offsetMs = offsetMsBeforeOpen; timeDlg.close(); });
    btnSaveOffset.addEventListener('click', ()=>{ localStorage.setItem('clockOffsetMs', String(offsetMs)); timeDlg.close(); });

    // ===== 入力（分・秒） =====
    [minInput, secInput].forEach(el => {
      el.addEventListener('input', () => applyFromInputs(false));
      el.addEventListener('change', () => applyFromInputs(false));
    });
    document.querySelectorAll('.arrows').forEach(group => {
      const targetId = group.dataset.for;
      const upBtn = group.querySelector('.up');
      const downBtn = group.querySelector('.down');
      attachHold(upBtn,  targetId, +1);
      attachHold(downBtn,targetId, -1);
    });
    function attachHold(btn, targetId, delta){
      let holdTo = null, holdIv = null;
      const step = () => { nudgeInput(targetId, delta); applyFromInputs(false); };
      const start = (e) => {
        e.preventDefault(); step();
        clearTimeout(holdTo); clearInterval(holdIv);
        holdTo = setTimeout(() => { holdIv = setInterval(step, 60); }, 300);
      };
      const end = () => { clearTimeout(holdTo); clearInterval(holdIv); };
      btn.addEventListener('mousedown', start);
      btn.addEventListener('touchstart', start, {passive:false});
      ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev => btn.addEventListener(ev, end));
    }

    function getMS(){ let m = parseInt(minInput.value,10)||0; let s = parseInt(secInput.value,10)||0; return {m,s}; }
    function setMS(m,s){ minInput.value = m; secInput.value = s; }
    function clamp(v,min,max){ return Math.min(max, Math.max(min,v)); }
    function nudgeInput(targetId, delta){
      let {m,s} = getMS();
      if(targetId === 'minInput'){
        m = clamp(m + delta, 0, 60); if(m === 60) s = 0;
      }else{
        s += delta;
        while(s >= 60 && m < 60){ s -= 60; m = Math.min(60, m+1); }
        while(s < 0 && m > 0){ s += 60; m = Math.max(0, m-1); }
        if(m === 60) s = 0; s = clamp(s, 0, 59);
      }
      setMS(m,s);
    }

    function applyFromInputs(forceReset){
      let {m,s} = getMS(); m = clamp(m,0,60); s = clamp(s,0,59); if(m===60) s=0; setMS(m,s);
      const sec = clamp(m*60 + s, 1, 3600); setDuration(sec, forceReset);
    }

    function setDuration(sec, andReset){
      durationSec = clamp(sec, 1, 3600);
      if(!running || andReset){
        remainingSec = durationSec;
        visualStartDeg = nowMinuteAngleDeg();
        drawArc(remainingSec, durationSec, visualStartDeg);
        updateTexts(); statusText.textContent = '待機中';
      }else{
        const now = performance.now();
        const passed = Math.max(0, (now - startTimeMs)/1000);
        remainingSec = Math.max(0, durationSec - passed);
        endTimeMs = performance.now() + remainingSec*1000;
        drawArc(remainingSec, durationSec, visualStartDeg);
        updateTexts();
      }
    }

    // ===== 針（アニメ） =====
    function renderClock(){
      const d = adjustedNow();
      const s = d.getSeconds() + d.getMilliseconds()/1000;
      const m = d.getMinutes() + s/60;
      const h = (d.getHours()%12) + m/60;
      hH.setAttribute('transform', `rotate(${h*30})`);
      hM.setAttribute('transform', `rotate(${m*6})`);
      hS.setAttribute('transform', `rotate(${s*6})`);
      updateDigital();
      requestAnimationFrame(renderClock);
    }
    requestAnimationFrame(renderClock);

    // ===== タイマー制御 =====
    btnStart.addEventListener('click', async () => {
      if(running) return;
      await ensureAudio(); await requestWakeLock();
      running = true; statusText.textContent = 'カウント中…';
      startTimeMs = performance.now();
      endTimeMs = startTimeMs + remainingSec*1000;
      arc.style.display = 'inline'; tick();
    });
    btnPause.addEventListener('click', async () => {
      if(!running) return;
      running = false; cancelAnimationFrame(rafId);
      remainingSec = Math.max(0, (endTimeMs - performance.now())/1000);
      statusText.textContent = '一時停止';
      drawArc(remainingSec, durationSec, visualStartDeg);
      updateTexts(); await releaseWakeLock();
    });
    btnReset.addEventListener('click', async () => {
      running = false; cancelAnimationFrame(rafId);
      remainingSec = durationSec; visualStartDeg = nowMinuteAngleDeg();
      arc.style.display = durationSec>0 ? 'inline' : 'none';
      drawArc(remainingSec, durationSec, visualStartDeg);
      statusText.textContent = '待機中'; updateTexts();
      document.getElementById('app').classList.remove('flash'); await releaseWakeLock();
    });

    function tick(){
      if(!running) return;
      const now = performance.now();
      remainingSec = Math.max(0, (endTimeMs - now)/1000);
      visualStartDeg = nowMinuteAngleDeg();
      drawArc(remainingSec, durationSec, visualStartDeg);
      updateTexts();
      if(remainingSec <= 0.001){
        running = false; statusText.textContent = '時間になりました';
        doneEffects(); releaseWakeLock(); return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function nowMinuteAngleDeg(){
      const d = adjustedNow();
      return (d.getMinutes() + d.getSeconds()/60) * 6;
    }
    function drawArc(remSec, totalSec, startDeg){
      const spanDegNow  = Math.max(0.001, Math.min(remSec * 0.1, 359.9));
      const s = startDeg - 90; const e = startDeg + spanDegNow - 90;
      const d = describeArc(150,150,132, s, e);
      arc.setAttribute('d', d); arc.setAttribute('stroke', 'var(--accent)');
      arc.style.display = totalSec>0 ? 'inline' : 'none';
    }
    function polarToCartesian(cx,cy,r,deg){
      const rad = deg*Math.PI/180;
      return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
    }
    function describeArc(cx,cy,r,startDeg,endDeg){
      let delta = endDeg - startDeg; const sweep = delta>=0 ? 1 : 0;
      delta = Math.abs(delta); const large = delta > 180 ? 1 : 0;
      const s = polarToCartesian(cx,cy,r,startDeg);
      const e = polarToCartesian(cx,cy,r,endDeg);
      return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} ${sweep} ${e.x} ${e.y}`;
    }

    function fmtRemain(sec){
      sec = Math.max(0, Math.round(sec));
      const m = Math.floor(sec/60); const s = sec%60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    function fmtEta(sec){
      const d = new Date(Date.now() + offsetMs + Math.max(0, Math.round(sec))*1000);
      return d.toLocaleTimeString('ja-JP',{hour:'2-digit', minute:'2-digit'}); // ETAは従来通り
    }
    function updateTexts(){
      remainText.textContent = fmtRemain(remainingSec);
      const base = running ? remainingSec : durationSec;
      etaText.textContent = `終了予定時刻 ${fmtEta(base)}`;
    }

    function doneEffects(){
      arc.setAttribute('stroke','var(--done)');
      document.getElementById('app').classList.add('flash');
      playAlarm();
      if(navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch{} }
    }

    // ===== オーディオ =====
    async function ensureAudio(){
      try{
        if(!audioCtx || audioCtx.state==='closed'){
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }else if(audioCtx.state==='suspended'){
          await audioCtx.resume();
        }
      }catch{}
    }
    function playAlarm(){
      ensureAudio();
      const mode = soundSelect.value;
      playSynth(mode);
    }
    function playSynth(mode){
      try{
        const ctx = audioCtx; if(!ctx) return;
        const t0 = ctx.currentTime + 0.01;
        const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
        const tone = (freq, type, start, dur, vol=0.6, attack=0.01, release=0.15) => {
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.type = type; o.frequency.setValueAtTime(freq, t0 + start);
          g.gain.setValueAtTime(0.0001, t0 + start);
          g.gain.exponentialRampToValueAtTime(vol, t0 + start + attack);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur + release);
          o.connect(g).connect(master); o.start(t0 + start); o.stop(t0 + start + dur + release + 0.02);
        };
        const seq = {
          pipipi: ()=>{ [0,0.25,0.50].forEach((s)=> tone(1000,'square', s, 0.18, 0.55, 0.008, 0.08)); },
          chime:  ()=>{ tone(1568,'sine',0,0.22,0.6,0.01,0.18); tone(1319,'sine',0.24,0.28,0.6,0.01,0.22); },
          bell:   ()=>{ tone(784,'triangle',0,0.6,0.7,0.005,0.6); },
          long:   ()=>{ tone(1046.5,'sine',0,1.0,0.6,0.02,0.25); },
          down3:  ()=>{ [1200,900,700].forEach((f,i)=> tone(f,'square', i*0.22, 0.18, 0.5, 0.01, 0.08)); },
        };
        (seq[mode] || seq.pipipi)();
      }catch(e){ console.error(e); }
    }

    // ===== 画面スリープ防止 =====
    let wakeLock = null;
    async function requestWakeLock(){
      try{
        if ('wakeLock' in navigator && !wakeLock){
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
        }
      }catch(e){}
    }
    async function releaseWakeLock(){ try{ await wakeLock?.release(); wakeLock = null; }catch{} }

    // 初期化
    applyFromInputs(true); updateTexts();
  })();
  </script>
</body>
</html>
