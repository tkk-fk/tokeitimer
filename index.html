<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<title>時計タイマー</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #1e293b;
    --accent: #2563eb;
    --stop: #ef4444;
    --ready: #22c55e;
    --muted: #94a3b8;
    --muted2:#64748b;

    --shadow: 0 10px 25px rgba(2,6,23,.08);
    --shadowUp: 0 -10px 30px rgba(2,6,23,.06);

    --r-xl: 22px;
    --r-lg: 16px;
    --r-md: 12px;

    /* 基本サイズ（PC/タブレット） */
    --gap: 14px;
    --pad: 16px;
    --btnH: 60px;
    --btnFz: 18px;
    --btnBigFz: 22px;
    --clockMax: 50svh; /* 画面高さの50%まで */

    /* iOS Safari 対策 */
    --appH: calc(var(--vh, 1vh) * 100);
  }

  /* ===== スマホ・幅狭・画面が低い端末用の強力な調整 ===== */
  @media (max-width: 600px), (max-height: 750px) {
    :root {
      --gap: 8px;
      --pad: 10px;
      --btnH: 50px;
      --btnFz: 15px;
      --btnBigFz: 18px;
      --clockMax: 40svh;
    }

    .settings-grid {
      grid-template-columns: 1fr !important;
      gap: 8px;
    }

    .setting-card {
      height: auto !important;
      min-height: 50px;
      padding: 6px 10px !important;
    }

    .num { width: 44px !important; height: 38px !important; font-size: 1.2rem !important; }
    .step-btn { width: 34px !important; height: 34px !important; font-size: 1.2rem !important; }
    .input-row { gap: 4px !important; }
    .input-stack { gap: 8px !important; }

    .remain { font-size: clamp(32px, 11vw, 50px) !important; margin-top: -5px !important; }
    .main-btns { gap: 8px !important; }
  }

  /* iPhone SEなどの極小画面対策 */
  @media (max-height: 600px) {
    :root { --clockMax: 32svh; --btnH: 44px; }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin:0; }

  body{
    font-family: "BIZ UDPGothic", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: var(--appH);
    min-height: 100svh;
    overflow: hidden;
    touch-action: manipulation;
    user-select:none; -webkit-user-select:none;
    overscroll-behavior: contain;
  }

  /* ===== 追加：秒針・残り時間の非表示 ===== */
  body.hide-sec #hand-sec { display: none; }
  body.hide-remain #remainText { display: none; }

  /* ===== レイアウト ===== */
  .app-shell{
    height: 100%;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: var(--pad);
    padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 4px);
    display:flex; flex-direction:column; gap: var(--gap);
    position: relative;
    background: var(--bg);
  }

  /* シンプルモード解除ボタン */
  #btnExitSimple {
    display: none; position: absolute; top: 10px; right: 10px; z-index: 100;
    padding: 8px 16px; background: rgba(255,255,255,0.9);
    border: 1px solid var(--muted); border-radius: 20px;
    font-size: 0.85rem; font-weight: 700; color: var(--ink);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer;
  }
  body.simple #btnExitSimple { display: block; }

  header{
    height: 40px; display:flex; align-items:center; justify-content:space-between; gap: 10px; min-height:0; flex-shrink: 0;
  }

  .title{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  h1{ margin:0; font-size: 1rem; color: var(--muted2); letter-spacing:.02em; white-space:nowrap; }
  .sub{ font-size:.75rem; color: var(--muted); white-space:nowrap; }

  .header-right{ display:flex; align-items:center; gap: 8px; }
  .toggle{ display:flex; align-items:center; gap:6px; font-size:.85rem; color: var(--muted2); cursor: pointer; white-space: nowrap;}
  .toggle input{ width: 16px; height: 16px; accent-color: var(--accent); }

  .iconBtn{
    border: none; background: var(--card); box-shadow: 0 3px 8px rgba(2,6,23,.06);
    border-radius: 999px; height: 32px; padding: 0 10px;
    display:flex; align-items:center; gap:6px; cursor:pointer;
    font-weight:700; color: var(--ink); font-size: 0.8rem; white-space: nowrap;
  }
  .iconBtn:active{ transform: scale(.98); }

  /* コンテンツレイアウト */
  .layout{
    flex: 1; min-height:0;
    display:flex; flex-direction: column;
    gap: var(--gap);
    justify-content: flex-end;
  }

  /* ===== 時計エリア ===== */
  .clock-area{
    flex: 1 1 auto;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 0; min-height: 0;
  }

  svg#clock{
    width:auto;
    height: auto;
    max-height: 100%;
    max-width: 100%;
    aspect-ratio: 1/1;
    filter: drop-shadow(0 8px 16px rgba(2,6,23,0.1));
  }
  #timerArc { fill: var(--accent); opacity: 0.15; transition: fill 0.3s; }
  #timerLine { stroke: var(--accent); transition: stroke 0.3s; }

  .timer-display{ text-align:center; display:grid; gap: 0; flex-shrink: 0; margin-top: 4px; }
  .remain{
    font-size: clamp(40px, 8vh, 64px); font-weight: 900;
    font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: 0.02em;
  }
  .eta{ font-size: 0.9rem; color: var(--muted2); font-weight:700; }
  .status{ font-size: 0.75rem; color: #94a3b8; font-weight:700; }

  @keyframes blink { 50% { opacity: 0.45; } }
  .finished{ animation: blink .65s step-end infinite; color: var(--stop) !important; }

  /* ===== 操作パネル ===== */
  .panel{
    background: var(--card); border-radius: var(--r-xl); padding: 14px;
    box-shadow: var(--shadowUp);
    display:flex; flex-direction:column; gap: var(--gap);
    flex-shrink: 0;
  }

  .main-btns{ display:grid; grid-template-columns: 2fr 1.2fr 1.2fr; gap: 12px; }
  .btn{
    border: none; border-radius: var(--r-lg); font-weight: 900; font-size: var(--btnFz);
    cursor: pointer; display:flex; align-items:center; justify-content:center;
    transition: transform .08s ease; height: var(--btnH);
    box-shadow: 0 4px 10px rgba(2,6,23,.05);
  }
  .btn:active{ transform: scale(0.97); }
  .btn-start{ background: var(--ready); color: #fff; font-size: var(--btnBigFz); }
  .btn-pause{ background: #e2e8f0; color: var(--ink); }
  .btn-reset{ background: #fff; color: var(--stop); border: 2px solid #fee2e2; box-shadow: none; }

  /* 設定グリッド */
  .settings-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .card-time { grid-column: 1 / -1; }
  .card-view { grid-column: 1 / -1; } /* 追加：表示設定を横いっぱい */

  .setting-card{
    background: #f1f5f9; border-radius: var(--r-md); padding: 8px 12px;
    display:flex; align-items:center; justify-content:space-between; gap: 10px;
    height: 60px;
  }

  .setting-title{ font-weight:900; color: var(--muted2); font-size: 0.9rem; white-space:nowrap; }

  .input-stack{ display:flex; gap: 10px; align-items:center; justify-content: flex-end; width: 100%; }
  .input-row{ display:flex; align-items:center; gap: 6px; }

  .num{
    width: 54px; height: 42px; text-align:center; font-size: 1.35rem; font-weight: 900;
    border: 2px solid var(--accent); border-radius: 10px; background: #fff; color: var(--ink);
    transition: border-color 0.3s;
    appearance: none; -webkit-appearance: none;
  }

  .step-btn{
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 1.4rem; font-weight: 900;
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: background-color 0.3s;
    display:flex; align-items:center; justify-content:center; padding-bottom:4px;
  }
  .step-btn:active{ transform: scale(0.95); }

  select{
    height: 38px; padding: 0 8px; border-radius: 8px; border: 1px solid #cbd5e1;
    background:#fff; font-size: 0.9rem; font-weight:700; color: var(--ink); width: 100%;
  }

  .color-dots { display: flex; gap: 10px; }
  .dot {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .dot.active { border-color: #fff; outline: 2px solid var(--ink); transform:scale(1.1); }

  /* ===== 変更：走行中は “表示設定” 以外を操作不可 ===== */
  body.is-running .settings-grid { opacity: 1; filter: none; }
  body.is-running .settings-grid .setting-card:not(.view-card){
    opacity:.5; pointer-events:none; filter: grayscale(10%);
  }

  /* シンプル表示 */
  body.simple .settings-grid { display:none; }
  body.simple .sub, body.simple .header-right { display:none; }
  body.simple .clock-area { justify-content: center; }
  body.simple svg#clock{ max-height: 65svh; }
  body.simple .eta{ display:none; }
  body.simple .status{ display:none; }
  body.simple .panel{ background: transparent; box-shadow: none; padding:0; }
  body.simple .main-btns { display: none; }

  /* ダイアログ */
  dialog{
    border:none; border-radius: 18px; padding: 16px;
    width: min(92vw, 420px); box-shadow: 0 20px 60px rgba(2,6,23,.25);
  }
  dialog::backdrop{ background: rgba(2,6,23,.35); }
  .dlgTitle{ margin: 0 0 6px; font-size: 1.1rem; font-weight: 900; }
  .dlgMuted{ margin: 0 0 12px; color: var(--muted2); font-size: .9rem; }
  .badgeRow{ display:flex; flex-wrap:wrap; gap: 8px; justify-content:flex-end; margin-top:10px; }
  .badge{
    border:none; background:#e2e8f0; border-radius: 999px; padding: 8px 12px;
    font-weight: 900; cursor:pointer;
  }
  .dlgActions{ display:flex; justify-content:flex-end; gap: 8px; margin-top: 16px; }
  .btn-mini{
    height: 40px; padding: 0 14px; border-radius: 10px; border: none;
    background:#e2e8f0; font-weight: 900; cursor:pointer;
  }
</style>
</head>

<body>
<div class="app-shell" id="app">
  <button id="btnExitSimple" type="button">⚙ 設定を出す</button>

  <header>
    <div class="title">
      <h1>時計タイマー</h1>
      <div class="sub" id="offsetHint">補正：0秒</div>
    </div>

    <div class="header-right">
      <label class="toggle" title="時計と残り時間だけの表示にします">
        <input type="checkbox" id="simpleToggle" />
        <span>シンプル</span>
      </label>

      <button class="iconBtn" id="btnOpenTimeDlg" type="button" aria-label="時刻合わせ">
        ⏱ 時刻合わせ
      </button>
    </div>
  </header>

  <div class="layout">
    <main class="clock-area">
      <svg id="clock" viewBox="0 0 300 300" role="img" aria-label="アナログ時計">
        <defs>
          <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".15"/>
          </filter>
        </defs>
        <circle cx="150" cy="150" r="145" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
        <g id="ticks"></g>
        <g id="nums"></g>
        <path id="timerArc" d=""></path>
        <path id="timerLine" d="" fill="none" stroke-width="10" stroke-linecap="round" filter="url(#shadow)"></path>
        <g id="hands" transform="translate(150,150)">
          <line id="hand-hour"   x1="0" y1="12" x2="0" y2="-66"  stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line id="hand-minute" x1="0" y1="14" x2="0" y2="-108" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
          <line id="hand-sec"    x1="0" y1="16" x2="0" y2="-118" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="6" fill="#1e293b"/>
        </g>
      </svg>

      <div class="timer-display">
        <div id="remainText" class="remain">--:--</div>
        <div id="etaText" class="eta">終了予定：--:--</div>
        <div id="statusText" class="status">待機中</div>
      </div>
    </main>

    <footer class="panel">
      <div class="main-btns">
        <button id="btnStart" class="btn btn-start">スタート</button>
        <button id="btnPause" class="btn btn-pause">ストップ</button>
        <button id="btnReset" class="btn btn-reset">リセット</button>
      </div>

      <div class="settings-grid">
        <div class="setting-card card-time">
          <div class="setting-title">じかん</div>
          <div class="input-stack">
            <div class="input-row">
              <button class="step-btn" id="minDown">−</button>
              <input type="text" inputmode="numeric" id="minInput" class="num" value="5" readonly>
              <span style="font-weight:bold; font-size:0.8rem">分</span>
              <button class="step-btn" id="minUp">＋</button>
            </div>
            <div class="input-row" style="margin-left:4px;">
              <button class="step-btn" id="secDown">−</button>
              <input type="text" inputmode="numeric" id="secInput" class="num" value="0" readonly>
              <span style="font-weight:bold; font-size:0.8rem">秒</span>
              <button class="step-btn" id="secUp">＋</button>
            </div>
          </div>
        </div>

        <!-- 追加：表示設定（秒針/残り時間の非表示） -->
        <div class="setting-card card-view view-card">
          <div class="setting-title">ひょうじ</div>
          <div style="flex:1; display:flex; align-items:center; justify-content:flex-end; gap:14px; flex-wrap:wrap;">
            <label class="toggle" title="秒針を表示しません">
              <input type="checkbox" id="hideSecToggle" />
              <span>秒針なし</span>
            </label>
            <label class="toggle" title="残り時間（大きな数字）を表示しません">
              <input type="checkbox" id="hideRemainToggle" />
              <span>残り時間なし</span>
            </label>
          </div>
        </div>

        <div class="setting-card">
          <div class="setting-title">いろ</div>
          <div class="color-dots" id="colorDots">
            <div class="dot active" style="background:#2563eb" data-color="#2563eb"></div>
            <div class="dot" style="background:#22c55e" data-color="#22c55e"></div>
            <div class="dot" style="background:#ef4444" data-color="#ef4444"></div>
            <div class="dot" style="background:#f97316" data-color="#f97316"></div>
          </div>
        </div>

        <!-- おと（やさしい音 + 音量） -->
        <div class="setting-card">
          <div class="setting-title">おと</div>
          <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
            <div style="display:flex; gap:8px;">
              <select id="soundSelect">
                <option value="soft" selected>やさしい</option>
                <option value="pipipi">ピピピ</option>
                <option value="chime">チャイム</option>
                <option value="bell">ベル</option>
              </select>
              <button class="btn-mini" id="btnPreview">試聴</button>
            </div>

            <div style="display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted2);">
              <span style="font-weight:900; white-space:nowrap;">音量</span>
              <input id="volRange" type="range" min="0" max="100" value="35" style="flex:1;">
              <span id="volLabel" style="width:3ch; text-align:right; font-weight:900;">35</span>
            </div>
          </div>
        </div>

      </div>
    </footer>
  </div>
</div>

<dialog id="timeDlg">
  <div class="dlgTitle">時刻合わせ</div>
  <p class="dlgMuted">教室の時計とズレている場合に使います。</p>
  <div style="display:flex; align-items:center; gap:10px;">
    <input id="timeInput" type="time" style="font-size:1.2rem; padding:8px; border-radius:8px; border:1px solid #ccc;">
    <div style="font-weight:bold;">現在：<span id="offsetText">±0分</span></div>
  </div>
  <div class="badgeRow">
    <button class="badge" data-d="-60000">-1分</button>
    <button class="badge" data-d="-10000">-10秒</button>
    <button class="badge" data-d="10000">+10秒</button>
    <button class="badge" data-d="60000">+1分</button>
  </div>
  <div class="dlgActions">
    <button class="btn-mini" id="btnResetOffset">リセット</button>
    <button class="btn-mini" id="btnSaveOffset" style="background:var(--accent); color:#fff;">決定</button>
  </div>
</dialog>

<script>
(() => {
  /* ===== レイアウト調整 ===== */
  const setVH = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
  setVH(); window.addEventListener('resize', setVH);

  /* ===== 要素参照 ===== */
  const el = (id) => document.getElementById(id);
  const arcFill = el('timerArc');
  const arcLine = el('timerLine');
  const hH = el('hand-hour');
  const hM = el('hand-minute');
  const hS = el('hand-sec');
  const remainText = el('remainText');
  const etaText = el('etaText');
  const statusText = el('statusText');
  const minInput = el('minInput');
  const secInput = el('secInput');
  const soundSelect = el('soundSelect');

  /* ===== 追加：表示設定（秒針/残り時間） ===== */
  const hideSecToggle = el('hideSecToggle');
  const hideRemainToggle = el('hideRemainToggle');
  let hideSec = localStorage.getItem('ut_hide_sec') === '1';
  let hideRemain = localStorage.getItem('ut_hide_remain') === '1';

  const applyViewFlags = () => {
    document.body.classList.toggle('hide-sec', hideSec);
    document.body.classList.toggle('hide-remain', hideRemain);
    hideSecToggle.checked = hideSec;
    hideRemainToggle.checked = hideRemain;
  };

  hideSecToggle.addEventListener('change', (e) => {
    hideSec = !!e.target.checked;
    localStorage.setItem('ut_hide_sec', hideSec ? '1' : '0');
    applyViewFlags();
  });

  hideRemainToggle.addEventListener('change', (e) => {
    hideRemain = !!e.target.checked;
    localStorage.setItem('ut_hide_remain', hideRemain ? '1' : '0');
    applyViewFlags();
  });

  /* ===== 設定値 ===== */
  let durationSec = 300;
  let remainingSec = 300;
  let running = false;
  let endTime = 0;
  let rafId = 0;
  let offsetMs = Number(localStorage.getItem('ut_offset') || 0);

  /* ===== 時計描画 ===== */
  const ticksG = el('ticks');
  const numsG = el('nums');
  for (let i=0; i<60; i++){
    const a = (i/60)*2*Math.PI;
    const is5 = i%5===0;
    const r1 = 145, r2 = is5 ? 124 : 135;
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", 150 + Math.sin(a)*r2);
    line.setAttribute("y1", 150 - Math.cos(a)*r2);
    line.setAttribute("x2", 150 + Math.sin(a)*r1);
    line.setAttribute("y2", 150 - Math.cos(a)*r1);
    line.setAttribute("stroke", is5 ? "#64748b" : "#cbd5e1");
    line.setAttribute("stroke-width", is5?3:1);
    ticksG.appendChild(line);
  }
  for(let h=1; h<=12; h++){
    const a = (h/12)*2*Math.PI;
    const txt = document.createElementNS("http://www.w3.org/2000/svg","text");
    txt.setAttribute("x", 150 + Math.sin(a)*108);
    txt.setAttribute("y", 150 - Math.cos(a)*108 + 6);
    txt.setAttribute("text-anchor", "middle");
    txt.setAttribute("font-size", "18");
    txt.setAttribute("font-weight", "900");
    txt.setAttribute("fill", "#334155");
    txt.textContent = h;
    numsG.appendChild(txt);
  }

  /* ===== 時計ロジック ===== */
  function getNow(){ return new Date(Date.now() + offsetMs); }

  function renderClock(){
    const d = getNow();
    const s = d.getSeconds() + d.getMilliseconds()/1000;
    const m = d.getMinutes() + s/60;
    const h = (d.getHours()%12) + m/60;
    hH.setAttribute('transform', `rotate(${h*30})`);
    hM.setAttribute('transform', `rotate(${m*6})`);
    // 秒針は非表示でも回転はしてOK（表示制御はCSS）
    hS.setAttribute('transform', `rotate(${s*6})`);
    requestAnimationFrame(renderClock);
  }
  requestAnimationFrame(renderClock);

  /* ===== タイマー描画 ===== */
  function drawTimer(rem){
    if(rem <= 0) {
      arcFill.setAttribute('d', '');
      arcLine.setAttribute('d', '');
      return;
    }
    const d = getNow();
    const startDeg = (d.getMinutes() + d.getSeconds()/60)*6 - 90;
    const sweep = (rem / 3600) * 360;
    const endDeg = startDeg + Math.min(sweep, 359.9);

    const r = 132;
    const start = polar(150, 150, r, startDeg);
    const end = polar(150, 150, r, endDeg);
    const large = sweep > 180 ? 1 : 0;

    const dPath = `M ${start.x} ${start.y} A ${r} ${r} 0 ${large} 1 ${end.x} ${end.y}`;
    arcFill.setAttribute('d', `M 150 150 L ${start.x} ${start.y} A ${r} ${r} 0 ${large} 1 ${end.x} ${end.y} Z`);
    arcLine.setAttribute('d', dPath);
  }
  function polar(cx, cy, r, deg){
    const rad = deg * Math.PI/180;
    return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
  }

  /* ===== UI更新 ===== */
  function updateText(){
    const m = Math.floor(remainingSec/60);
    const s = Math.floor(remainingSec%60);
    remainText.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    drawTimer(remainingSec);

    if(remainingSec > 0){
      const t = new Date(Date.now() + offsetMs + remainingSec*1000);
      etaText.textContent = `終了予定：${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
    } else {
      etaText.textContent = '終了予定：--:--';
    }
  }

  /* ===== 入力操作 ===== */
  function nudge(dm, ds){
    if(running) return;
    let m = parseInt(minInput.value) + dm;
    let s = parseInt(secInput.value) + ds;

    if(s >= 60) { s-=60; m++; }
    if(s < 0) { s+=60; m--; }

    m = Math.max(0, Math.min(60, m));
    if(m===60) s=0;

    minInput.value = m;
    secInput.value = s;

    durationSec = m*60 + s;
    remainingSec = durationSec;
    statusText.textContent = '待機中';
    remainText.classList.remove('finished');
    updateText();
  }

  function attachHold(btn, cb){
    let t, i;
    const start = (e) => { e.preventDefault(); cb(); t=setTimeout(()=>{ i=setInterval(cb, 80); }, 400); };
    const end = () => { clearTimeout(t); clearInterval(i); };
    btn.addEventListener('touchstart', start, {passive:false}); btn.addEventListener('touchend', end);
    btn.addEventListener('mousedown', start); btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
  }
  attachHold(el('minUp'), ()=>nudge(1,0));
  attachHold(el('minDown'), ()=>nudge(-1,0));
  attachHold(el('secUp'), ()=>nudge(0,5));
  attachHold(el('secDown'), ()=>nudge(0,-5));

  /* ===== オーディオ制御（やさしい音・音量制限・高音カット） ===== */
  let audioCtx = null;
  let masterGain = null;
  let comp = null;
  let lp = null;

  const volRange = el('volRange');
  const volLabel = el('volLabel');

  // 0〜100 → 0.00〜0.35（最大でも大きくなりすぎないよう制限）
  let vol01 = Number(localStorage.getItem('ut_vol01') || 0.22); // 0〜0.35
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function ensureAudio(){
    if(audioCtx) return;

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = vol01;

    // 急なピークをやわらげる
    comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -26;
    comp.knee.value = 18;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.22;

    // 高音を少し落として“角”を取る
    lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1800;
    lp.Q.value = 0.7;

    masterGain.connect(comp);
    comp.connect(lp);
    lp.connect(audioCtx.destination);
  }

  function unlockAudio() {
    ensureAudio();
    if(audioCtx.state === 'suspended') audioCtx.resume();

    // iOS対策：無音に近い短音でアンロック
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 440;
    g.gain.value = 0.00001;
    o.connect(g);
    g.connect(masterGain);
    const t = audioCtx.currentTime;
    o.start(t);
    o.stop(t + 0.02);
  }

  // やさしい“ポン”（アタックを緩める）
  function playNote(freq, when, dur, opts = {}){
    if(!audioCtx) return;
    const type = opts.type || 'sine';
    const gain = opts.gain ?? 1;
    const detune = opts.detune ?? 0;

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.type = type;
    o.frequency.value = freq;
    o.detune.value = detune;

    o.connect(g);
    g.connect(masterGain);

    const t0 = audioCtx.currentTime + when;

    const attack = 0.035;
    const decay  = 0.09;
    const sustain = 0.55;
    const release = 0.28;

    const peak = 1.0 * gain;

    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + attack);
    g.gain.linearRampToValueAtTime(peak * sustain, t0 + attack + decay);
    g.gain.setValueAtTime(peak * sustain, t0 + dur);
    g.gain.linearRampToValueAtTime(0, t0 + dur + release);

    o.start(t0);
    o.stop(t0 + dur + release + 0.05);
  }

  function playSoftChime(){
    const base = [
      {f: 523.25, t: 0.00, d: 0.22}, // C5
      {f: 659.25, t: 0.18, d: 0.26}, // E5
      {f: 523.25, t: 0.44, d: 0.30}, // C5
    ];
    base.forEach(n=>{
      playNote(n.f, n.t, n.d, {type:'sine', gain:0.85});
      playNote(n.f, n.t, n.d, {type:'sine', gain:0.35, detune:+7});
    });
  }

  function playSoftPipipi(){
    const f = 660;
    playNote(f, 0.00, 0.10, {type:'sine', gain:0.65});
    playNote(f, 0.22, 0.10, {type:'sine', gain:0.65});
    playNote(f, 0.44, 0.10, {type:'sine', gain:0.65});
  }

  function playSoftBell(){
    playNote(440, 0.00, 0.35, {type:'sine', gain:0.75});
    playNote(440, 0.00, 0.35, {type:'triangle', gain:0.25});
    playNote(554.37, 0.20, 0.40, {type:'sine', gain:0.65});
  }

  function playAlarm(){
    if(!audioCtx) return;
    const mode = soundSelect.value;

    if(mode === 'soft'){
      playSoftChime();
    } else if(mode === 'pipipi'){
      playSoftPipipi();
    } else if(mode === 'chime'){
      playSoftChime();
    } else {
      playSoftBell();
    }
  }

  // 試聴
  el('btnPreview').onclick = () => { unlockAudio(); playAlarm(); };

  // 音量UI（0〜100 → 0〜0.35）
  if(volRange && volLabel){
    const toUI = (v01) => Math.round((v01 / 0.35) * 100);
    const fromUI = (v) => clamp((Number(v) / 100) * 0.35, 0, 0.35);

    volRange.value = String(toUI(vol01));
    volLabel.textContent = volRange.value;

    volRange.addEventListener('input', () => {
      volLabel.textContent = volRange.value;
      vol01 = fromUI(volRange.value);
      localStorage.setItem('ut_vol01', String(vol01));
      if(masterGain) masterGain.gain.value = vol01;
    });
  }

  /* ===== タイマー操作 ===== */
  el('btnStart').onclick = () => {
    if(running) return;

    // 0秒のときは開始しない
    if(remainingSec <= 0){
      statusText.textContent = '時間を設定してください';
      remainText.classList.remove('finished');
      updateText();
      return;
    }

    unlockAudio();
    running = true;
    document.body.classList.add('is-running');
    statusText.textContent = 'カウント中…';
    remainText.classList.remove('finished');
    endTime = performance.now() + remainingSec * 1000;
    tick();
  };

  el('btnPause').onclick = () => {
    running = false;
    document.body.classList.remove('is-running');
    statusText.textContent = '一時停止';
    cancelAnimationFrame(rafId);
  };

  /* ★リセット：分も秒も0 */
  el('btnReset').onclick = () => {
    running = false;
    document.body.classList.remove('is-running');
    cancelAnimationFrame(rafId);

    minInput.value = 0;
    secInput.value = 0;

    durationSec = 0;
    remainingSec = 0;

    statusText.textContent = '待機中';
    remainText.classList.remove('finished');
    updateText();
  };

  function tick(){
    if(!running) return;
    const now = performance.now();
    remainingSec = Math.max(0, (endTime - now)/1000);
    updateText();
    if(remainingSec <= 0.05){
      running = false;
      document.body.classList.remove('is-running');
      statusText.textContent = '時間です';
      remainText.classList.add('finished');
      playAlarm();
      remainingSec = 0;
      updateText();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  /* ===== 色変更 ===== */
  const dots = document.querySelectorAll('.dot');
  dots.forEach(d => {
    d.onclick = () => {
      dots.forEach(x => x.classList.remove('active'));
      d.classList.add('active');
      const c = d.dataset.color;
      document.documentElement.style.setProperty('--accent', c);
    };
  });

  /* ===== シンプル切替 ===== */
  const toggleSimple = (on) => {
    document.body.classList.toggle('simple', on);
    el('simpleToggle').checked = on;
  };
  el('simpleToggle').onchange = (e) => toggleSimple(e.target.checked);
  el('btnExitSimple').onclick = () => toggleSimple(false);

  /* ===== 時刻合わせ ===== */
  const dlg = el('timeDlg');
  el('btnOpenTimeDlg').onclick = () => {
    el('offsetText').textContent = `±${Math.round(offsetMs/60000)}分`;
    dlg.showModal();
  };
  dlg.querySelectorAll('.badge').forEach(b => {
    b.onclick = () => {
      offsetMs += Number(b.dataset.d);
      localStorage.setItem('ut_offset', offsetMs);
      el('offsetText').textContent = `${offsetMs>=0?'+':''}${Math.round(offsetMs/1000)}秒`;
      el('offsetHint').textContent = `補正：${Math.round(offsetMs/1000)}秒`;
    };
  });
  el('btnSaveOffset').onclick = () => dlg.close();
  el('btnResetOffset').onclick = () => {
    offsetMs=0;
    localStorage.setItem('ut_offset',0);
    dlg.close();
    el('offsetHint').textContent = '補正：0秒';
  };

  /* ===== 初期反映 ===== */
  el('offsetHint').textContent = `補正：${Math.round(offsetMs/1000)}秒`;

  // 入力値から初期時間を作る
  durationSec = (parseInt(minInput.value) || 0) * 60 + (parseInt(secInput.value) || 0);
  remainingSec = durationSec;

  // 追加：表示設定の初期反映（localStorage）
  applyViewFlags();

  updateText();
})();
</script>
</body>
</html>
